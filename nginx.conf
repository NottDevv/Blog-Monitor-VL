worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # غیرفعال‌سازی ریدایرکت‌های خودکار به پورت داخلی 8080
    port_in_redirect off;
    absolute_redirect off;

    # تشخیص هوشمند gRPC بر اساس Content-Type
    map $http_content_type $is_grpc {
        "~*application/grpc" 1;
        default              0;
    }

    server {
        listen 8080;
        server_name _;

        # -------------------------------------------------------------
        # ۱. صفحه فرود استتار (Decoy Site)
        # -------------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ =404;
        }

        # -------------------------------------------------------------
        # ۲. مسیر پنل مدیریت (حل مشکل ریدایرکت 8080 و 502)
        # -------------------------------------------------------------
        location _PANEL_PATH_ {
            proxy_pass http://127.0.0.1:2053/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            sub_filter '<title>3x-ui</title>' '<title>_CUSTOM_TITLE_</title>';
            sub_filter_once on;
        }

        # -------------------------------------------------------------
        # ۳. مسیر لینک سابسکریپشن
        # -------------------------------------------------------------
        location _SUB_PATH_ {
            proxy_pass http://127.0.0.1:_SUB_PORT_;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------
        # ۴. اینباندهای gRPC اختصاصی
        # -------------------------------------------------------------
        location ~ ^_API_PREFIX_(?<target_port>\d+)(/.*)?$ {
            # اگر درخواست gRPC باشد به مسیر gRPC داخلی هدایت می‌شود
            error_page 418 = @grpc_route;
            if ($is_grpc = 1) {
                return 418;
            }

            # تنظیمات ترافیک عادی (WebSocket / XHTTP / HTTP)
            client_max_body_size 0;
            proxy_buffering off;
            proxy_request_buffering off;

            proxy_pass http://127.0.0.1:$target_port;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # مسیریاب اختصاصی gRPC (بدون تداخل با HTTP/1.1)
        location @grpc_route {
            grpc_pass grpc://127.0.0.1:$target_port;
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
