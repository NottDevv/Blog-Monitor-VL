worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # -------------------------------------------------------------
    # ۱. تشخیص هوشمند نوع پروتکل ورودی (gRPC یا HTTP/WS)
    # -------------------------------------------------------------
    map $http_content_type $connection_type {
        "~*application/grpc" "grpc";
        default              "http";
    }

    server {
        listen 8080;
        server_name _;

        # -------------------------------------------------------------
        # ۲. صفحه فرود استتار (Decoy Site) برای ترافیک عادی
        # -------------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ =404;
        }

        # -------------------------------------------------------------
        # ۳. مسیر پنل مدیریت (Dynamic Panel Path)
        # -------------------------------------------------------------
        location _PANEL_PATH_ {
            proxy_pass http://127.0.0.1:2053;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # پشتیبانی کامل از WebSocket برای پنل
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # تغییر عنوان اصلی صفحه پنل در مرورگر
            sub_filter '<title>3x-ui</title>' '<title>_CUSTOM_TITLE_</title>';
            sub_filter_once on;
        }

        # -------------------------------------------------------------
        # ۴. مسیر دریافت لینک‌های سابسکریپشن (Dynamic Subscription)
        # -------------------------------------------------------------
        location _SUB_PATH_ {
            proxy_pass http://127.0.0.1:_SUB_PORT_;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------
        # ۵. مسیریابی داینامیک تمام اینباندها (WS / XHTTP / gRPC)
        # -------------------------------------------------------------
        location ~ ^_API_PREFIX_(?<target_port>\d+)(/.*)?$ {
            # غیرفعال‌سازی بافرینگ برای کاهش تاخیر و پشتیبانی از XHTTP
            client_max_body_size 0;
            proxy_buffering off;
            proxy_request_buffering off;

            # سوئیچ به پروتکل gRPC در صورت تشخیص ترافیک gRPC
            if ($connection_type = "grpc") {
                grpc_pass grpc://127.0.0.1:$target_port;
            }

            # ترافیک عادی (WebSocket / HTTP / XHTTP)
            proxy_pass http://127.0.0.1:$target_port;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # تنظیم تایم‌اوت‌های ۲۴ ساعته جهت حفظ اتصال مداوم
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
        }
    }
}
