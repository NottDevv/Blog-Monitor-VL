worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # جلوگیری از ریدایرکت‌های اشتباه به پورت داخلی Nginx (8080)
    port_in_redirect off;
    absolute_redirect off;

    # ۱. مدیریت هوشمند هدر Connection برای جلوگیری از خطای 502 در پنل و XHTTP
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ۲. تشخیص ترافیک gRPC
    map $http_content_type $is_grpc {
        "~*application/grpc" 1;
        default              0;
    }

    server {
        listen 8080;
        server_name _;

        # -------------------------------------------------------------
        # ۳. صفحه فرود استتار (Decoy Site)
        # -------------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ =404;
        }

        # -------------------------------------------------------------
        # ۴. مسیر پنل مدیریت
        # -------------------------------------------------------------
        # درخواست بدون / انتهایی را به مسیر دارای / هدایت می‌کند.
        location = _PANEL_PATH_NO_SLASH_ {
            return 301 _PANEL_PATH_;
        }

        location _PANEL_PATH_ {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # اجازه می‌دهد sub_filter روی HTML پاسخ backend کار کند.
            proxy_set_header Accept-Encoding "";

            sub_filter '<title>3x-ui</title>' '<title>_TITLE_HERE_</title>';
            sub_filter_once on;
        }

        # -------------------------------------------------------------
        # ۵. مسیر لینک سابسکریپشن
        # -------------------------------------------------------------
        location _SUB_PATH_ {
            proxy_pass http://127.0.0.1:_SUB_PORT_;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------
        # ۶. مسیریابی داینامیک تمام اینباندها (WS / XHTTP / gRPC)
        # -------------------------------------------------------------
        location ~ ^_API_PREFIX_(?<target_port>\d+)(/.*)?$ {
            error_page 418 = @grpc_route;
            if ($is_grpc = 1) {
                return 418;
            }

            client_max_body_size 0;
            proxy_buffering off;
            proxy_request_buffering off;

            proxy_pass http://127.0.0.1:$target_port;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # -------------------------------------------------------------
        # ۷. هندلر اختصاصی gRPC (بدون تداخل با هدرهای HTTP)
        # -------------------------------------------------------------
        location @grpc_route {
            grpc_pass grpc://127.0.0.1:$target_port;
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
