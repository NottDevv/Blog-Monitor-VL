user root;
worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080 default_server;
        
        # 1. سایت استتار
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # 2. پنل مدیریت (داینامیک)
        location _PANEL_PATH_ {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            
            # حتما باید Accept-Encoding خالی شود تا Response فشرده‌سازی نشود و sub_filter کار کند
            proxy_set_header Accept-Encoding "";

            # تزریق اسکریپت مقاوم در برابر Vue/SPA نسخه‌های جدید 3x-ui
            sub_filter '</head>' '<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon"><script>
              (function() {
                const customTitle = "_TITLE_HERE_";
                document.title = customTitle;
                
                // جلوگیری از تغییر تایتل توسط کامپوننت‌های Vue/React در نسخه جدید
                const target = document.querySelector("title") || document.documentElement;
                const observer = new MutationObserver(function() {
                  if (document.title !== customTitle) {
                    document.title = customTitle;
                  }
                });
                observer.observe(target, { subtree: true, characterData: true, childList: true });
              })();
            </script></head>';
            
            sub_filter_once on;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location = /favicon.ico {
            root /usr/share/nginx/html;
            access_log off;
            expires max;
        }

        # 3. لینک سابسکریپشن (داینامیک)
        location _SUB_PATH_ {
            proxy_pass http://127.0.0.1:_SUB_PORT_;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 4. جادوی Regex برای پورت‌ها (داینامیک)
        location ~ ^_API_PREFIX_(?<target_port>\d+)/ {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:$target_port;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Original-URI $request_uri;
        }
    }
}
