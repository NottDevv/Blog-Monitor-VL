worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ۱. غیرفعال‌سازی ریدایرکت‌های خودکار پورت داخلی Nginx
    port_in_redirect off;
    absolute_redirect off;

    # ۲. تشخیص هوشمند ترافیک gRPC
    map $http_content_type $connection_type {
        "~*application/grpc" "grpc";
        default              "http";
    }

    server {
        listen 8080;
        server_name _;

        # -------------------------------------------------------------
        # ۳. صفحه فرود استتار (Decoy Site)
        # -------------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ =404;
        }

        # -------------------------------------------------------------
        # ۴. مسیر پنل مدیریت (حل مشکل ریدایرکت پورت ۸۰۸۰ و ۵۰۲)
        # -------------------------------------------------------------
        location _PANEL_PATH_ {
            proxy_pass http://127.0.0.1:2053/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # پشتیبانی از WebSocket داخل پنل
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # تغییر عنوان اصلی صفحه پنل
            sub_filter '<title>3x-ui</title>' '<title>_CUSTOM_TITLE_</title>';
            sub_filter_once on;
        }

        # -------------------------------------------------------------
        # ۵. مسیر دریافت لینک‌های سابسکریپشن (Dynamic Subscription)
        # -------------------------------------------------------------
        location _SUB_PATH_ {
            proxy_pass http://127.0.0.1:_SUB_PORT_;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------
        # ۶. مسیریابی داینامیک تمام اینباندها (WS / XHTTP / gRPC)
        # -------------------------------------------------------------
        location ~ ^_API_PREFIX_(?<target_port>\d+)(/.*)?$ {
            client_max_body_size 0;
            proxy_buffering off;
            proxy_request_buffering off;

            if ($connection_type = "grpc") {
                grpc_pass grpc://127.0.0.1:$target_port;
            }

            proxy_pass http://127.0.0.1:$target_port;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
        }
    }
}
