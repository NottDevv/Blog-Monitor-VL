worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # تنظیم Map جهت تشخیص هوشمند ترافیک gRPC از روی Header
    map $http_content_type $connection_type {
        "~*application/grpc" "grpc";
        default              "http";
    }

    server {
        listen 8080;
        server_name _;

        # -------------------------------------------------------------
        # ۱. صفحه فرود استتار (Decoy Site)
        # -------------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ =404;
        }

        # -------------------------------------------------------------
        # ۲. پنل مدیریت (Dynamic Panel Path)
        # -------------------------------------------------------------
        location ~ ^/_PANEL_PATH_(.*)$ {
            proxy_pass http://127.0.0.1:2053/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # پشتیبانی از WebSocket داخل پنل
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # تزریق عنوان دلخواه مرورگر
            sub_filter '<title>3x-ui</title>' '<title>_CUSTOM_TITLE_</title>';
            sub_filter_once on;
        }

        # -------------------------------------------------------------
        # ۳. مسیر لینک سابسکریپشن (Dynamic Subscription)
        # -------------------------------------------------------------
        location ~ ^/_SUB_PATH_(.*)$ {
            proxy_pass http://127.0.0.1:_SUB_PORT_/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------
        # ۴. هدایت داینامیک تمام اینباندها (WS / XHTTP / gRPC)
        # -------------------------------------------------------------
        location ~ ^_API_PREFIX_(?<target_port>\d+)(/.*)?$ {
            # حذف محدودیت حجم آپلود برای XHTTP
            client_max_body_size 0;
            
            # غیرفعال کردن بافرینگ جهت کاهش تاخیر
            proxy_buffering off;
            proxy_request_buffering off;

            # اگر درخواست gRPC بود:
            if ($connection_type = "grpc") {
                grpc_pass grpc://127.0.0.1:$target_port;
            }

            # اگر درخواست WS یا XHTTP بود:
            proxy_pass http://127.0.0.1:$target_port;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # تنظیم تاائم‌اوت اتصالات طولانی‌مدت
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
        }
    }
}
